<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e2428" />
  <meta name="description" content="Live rain and air check before you step outside." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Step Out" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Step Out</title>
  <style>
    @property --a{syntax:"<color>";inherits:true;initial-value:#16363c}
    @property --b{syntax:"<color>";inherits:true;initial-value:#0b1c20}
    :root{--serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{--a:#16363c;--b:#0b1c20;--fg:#f4efe4;--mute:rgba(244,239,228,.66);--line:rgba(244,239,228,.2);--orb:#f4efe4;--glow:rgba(244,239,228,.1);--btn:#f4efe4;--btnfg:#0e2428;
      margin:0;min-height:100dvh;font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;
      background:linear-gradient(170deg,var(--a),var(--b)) fixed var(--b);transition:--a 1.4s ease,--b 1.4s ease,color 1s}
    body[data-level=go]{--a:#fbe3b4;--b:#f2b98a;--fg:#1b2a2c;--mute:rgba(27,42,44,.7);--line:rgba(27,42,44,.2);--orb:#fff6df;--glow:rgba(255,160,70,.6);--btn:#1b2a2c;--btnfg:#fff6df}
    body[data-level=wait]{--a:#ebe6d9;--b:#a9b9b4;--fg:#1b2a2c;--mute:rgba(27,42,44,.7);--line:rgba(27,42,44,.2);--orb:#f2c76f;--glow:rgba(242,199,111,.45);--btn:#1b2a2c;--btnfg:#f1efe6;--cloud:#e6ebe6}
    body[data-level=skip]{--a:#2a5560;--b:#0b1c20;--orb:#9cc5d1;--glow:rgba(120,180,200,.3)}
    .wrap{max-width:520px;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;
      padding:max(22px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:10px;font:600 .95rem var(--sans);letter-spacing:-.01em}
    header i{width:11px;height:11px;border-radius:50%;background:var(--orb)}
    .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:28px}
    .orb-wrap{position:relative;width:min(56vw,236px);transition:width 1s var(--ease)}
    body[data-level] .orb-wrap{width:min(46vw,190px)}
    .orb{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:transparent;
      box-shadow:inset 0 0 0 2px var(--orb),0 0 80px var(--glow);opacity:.8;animation:breathe 7s ease-in-out infinite;
      transition:background .8s,box-shadow 1s,opacity 1s}
    
    body[data-level=go] .orb,body[data-level=wait] .orb{background:var(--orb);opacity:1;box-shadow:0 0 90px 10px var(--glow)}
    body[data-level=skip] .orb{opacity:1}
    .orb::after{content:"";position:absolute;left:36%;right:-16%;bottom:-3%;height:50%;border-radius:999px;
      background:var(--cloud,transparent);box-shadow:-38px -24px 0 -8px var(--cloud,transparent);opacity:0;transform:translateX(34%);transition:opacity .8s,transform 1.2s var(--ease)}
    body[data-level=wait] .orb::after{opacity:.96;transform:none}
    @keyframes breathe{50%{transform:scale(1.035)}}
    .headline{font:400 clamp(2.5rem,12vw,4.2rem)/.98 var(--serif);letter-spacing:-.035em;margin:40px 0 14px;max-width:11em;text-wrap:balance}
    .why{font:1rem/1.5 var(--sans);color:var(--mute);max-width:32ch;margin:0;text-wrap:pretty}
    .place{font:.82rem var(--sans);color:var(--mute);margin:18px 0 0}
    .data{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows 1.1s var(--ease),margin-top 1.1s var(--ease)}
    .data>.inner{min-height:0;overflow:hidden}
    body[data-level] .data{grid-template-rows:1fr;margin-top:34px;visibility:visible}
    .stats{display:grid;grid-template-columns:repeat(3,1fr)}
    .stat{position:relative;padding-left:16px}
    .stat:first-child{padding-left:0}
    .stat+.stat::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line);transform-origin:top}
    .stat:nth-child(2){--n:1}.stat:nth-child(3){--n:2}
    .stat b{font-variant-numeric:tabular-nums}
    body[data-level] .stat{animation:in .9s var(--ease) calc(var(--n,0)*110ms + 350ms) backwards}
    body[data-level] .stat+.stat::before{animation:draw 1s var(--ease) calc(var(--n,0)*110ms + 500ms) backwards}
    .stat b{display:block;font:400 1.9rem/1 var(--serif);letter-spacing:-.02em}
    .stat span{display:block;margin-top:8px;font:.76rem/1.3 var(--sans);color:var(--mute)}
    .strip{display:flex;gap:7px;height:104px;margin-top:30px}
    .slot{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center}
    .track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
    .bar{display:block;width:100%;max-width:28px;height:calc(var(--p)*1%);border-radius:99px;
      background:color-mix(in srgb,var(--fg) 22%,transparent);transform-origin:bottom;
      animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms + 250ms)}
    .wet .bar{background:var(--fg)}
    @keyframes rise{from{transform:scaleY(0)}}
    .t{font:.64rem var(--sans);font-variant-numeric:tabular-nums;color:var(--mute)}
    .note{font:.76rem var(--sans);color:var(--mute);margin:16px 0 0;text-align:center}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
    button{font:500 .92rem var(--sans);padding:13px 22px;border-radius:99px;border:1px solid var(--line);
      background:transparent;color:var(--fg);cursor:pointer;transition:transform .15s,opacity .4s,color 1s,background-color 1s,border-color 1s}
    button:active{transform:scale(.97)}
    button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
    #locate{background:var(--btn);color:var(--btnfg);border-color:transparent}
    [hidden]{display:none!important}
    footer{margin-top:28px;font:.72rem/1.5 var(--sans);color:var(--mute);text-align:center}
    footer a{color:inherit}
    @keyframes in{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}
    @keyframes fade{from{opacity:0}}
    @keyframes grow{from{opacity:0;transform:scale(.72)}}
    @keyframes draw{from{transform:scaleY(0)}}
    @keyframes spin{to{transform:rotate(1turn)}}
    :root{--ease:cubic-bezier(.2,.8,.2,1)}
    .orb-wrap{animation:grow 1.5s var(--ease) backwards}
    .headline{animation:in 1s var(--ease) .4s backwards}
    .why{animation:in 1s var(--ease) .52s backwards}
    .place{animation:in 1s var(--ease) .64s backwards}
    .row{animation:in 1s var(--ease) .78s backwards}
    header,footer{animation:fade 1.6s ease .9s backwards}
    .why,.place,.stat span,.t,.note,footer{transition:color 1s}
    header i,.bar{transition:background-color 1s}
    .ping{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--orb);opacity:0;pointer-events:none}
    .orb-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;opacity:0;transition:opacity .5s;
      background:conic-gradient(from 0deg,transparent 0 55%,var(--orb) 100%);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
      mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
      animation:spin 1.6s linear infinite paused}
    body.loading .orb-wrap::before{opacity:.9;animation-play-state:running}
    body.loading #locate,body.loading #refresh{opacity:.45;pointer-events:none}
    @media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><i></i>Step Out</header>
    <section class="hero">
      <div class="orb-wrap" id="orbwrap"><div class="orb" id="orb" role="img" aria-label="Waiting for a reading"></div><i class="ping" id="ping"></i></div>
      <h2 class="headline" id="headline">Should you step out?</h2>
      <p class="why" id="why">A two-hour call on rain, air, and wind.</p>
      <p class="place" id="place" aria-live="polite">Waiting for a location.</p>
    </section>
    <section class="data" id="verdict"><div class="inner">
      <div class="stats">
        <div class="stat"><b id="temp">–</b><span>Feels like</span></div>
        <div class="stat"><b id="rain">–</b><span>Rain, next 2h</span></div>
        <div class="stat"><b id="air">–</b><span id="airl">Air</span></div>
      </div>
      <div class="strip" id="strip"></div>
      <p class="note" id="meta"></p>
    </div></section>
    <div class="row">
      <button id="locate" type="button">Use my location</button>
      <button id="refresh" type="button">Refresh</button>
      <button id="install" type="button" hidden>Install</button>
    </div>
    <footer>
      Weather and air from <a href="https://open-meteo.com/">Open-Meteo</a> (CC BY 4.0). Non-commercial free tier.
      Last reading is saved on this device if the network drops.
    </footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const KEY = "step-out-last";
    const TOP = { go: "#fbe3b4", wait: "#ebe6d9", skip: "#2a5560" };
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const EASE = "cubic-bezier(.2,.8,.2,1)";
    let first = true;

    // Old text lifts away, new text rises in.
    function put(el, text, delay = 0) {
      if (el.textContent === text) return;
      if (first || calm) { el.textContent = text; return; }
      const out = el.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-10px)", filter: "blur(6px)" }],
        { duration: 220, delay, easing: "ease-in", fill: "forwards" });
      out.finished.then(() => {
        el.textContent = text;
        out.cancel();
        el.animate([{ opacity: 0, transform: "translateY(12px)", filter: "blur(6px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }],
          { duration: 750, easing: EASE });
      });
    }

    // Numbers roll from their last value to the new one.
    function countTo(el, to, fmt) {
      if (to == null) { el.textContent = "–"; delete el.dataset.v; return; }
      const from = el.dataset.v == null ? 0 : +el.dataset.v;
      el.dataset.v = to;
      if (calm) { el.textContent = fmt(to); return; }
      const t0 = performance.now() + 350;
      const step = (t) => {
        const k = Math.min(1, Math.max(0, (t - t0) / 1000));
        el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // The sun settles and sends one ripple when an answer lands.
    function arrive() {
      if (first || calm) return;
      $("orb").animate([{ transform: "scale(.9)" }, { transform: "scale(1)" }],
        { duration: 1100, easing: "cubic-bezier(.34,1.4,.64,1)", composite: "add" });
      $("ping").animate([{ opacity: .5, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.65)" }],
        { duration: 1600, easing: EASE });
    }
    let coords = null;
    let deferredPrompt = null;

    const WMO = {
      0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Rime fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
      61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow",
      80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"
    };

    function aqiLabel(v) {
      if (v == null) return "unknown";
      if (v <= 20) return "good";
      if (v <= 40) return "fair";
      if (v <= 60) return "moderate";
      if (v <= 80) return "poor";
      if (v <= 100) return "very poor";
      return "extremely poor";
    }

    function decide(wx, aq) {
      const probs = (wx.minutely_15?.precipitation_probability || []).slice(0, 8);
      const prec = (wx.minutely_15?.precipitation || []).slice(0, 8);
      const maxP = probs.length ? Math.max(...probs) : 0;
      const wetNow = (wx.current?.precipitation || 0) > 0.1 || (prec[0] || 0) > 0.1;
      const aqi = aq?.current?.european_aqi;
      const wind = wx.current?.wind_speed_10m || 0;
      const feel = wx.current?.apparent_temperature;
      let level = "go";
      let headline = "Go.";
      const reasons = [];
      if (wetNow) { level = "skip"; headline = "Wait it out."; reasons.push("It is raining at your spot."); }
      else if (maxP >= 60) { level = "wait"; headline = "Leave soon, or take a shell."; reasons.push(`Rain chance hits ${maxP}% in the next two hours.`); }
      else if (maxP >= 30) { level = "wait"; headline = "Fine, but pack a layer."; reasons.push(`A ${maxP}% chance of rain is in the next two hours.`); }
      else reasons.push("Rain looks unlikely for the next two hours.");
      if (aqi != null && aqi > 60) { level = level === "go" ? "wait" : level; if (aqi > 80) level = "skip"; headline = aqi > 80 ? "Skip the outdoor block." : "Short trip only."; reasons.push(`Air is ${aqiLabel(aqi)} (EU AQI ${Math.round(aqi)}).`); }
      else if (aqi != null) reasons.push(`Air is ${aqiLabel(aqi)}.`);
      if (wind >= 40) reasons.push(`Wind is ${Math.round(wind)} km/h.`);
      if (feel != null && feel <= 5) reasons.push(`It feels like ${Math.round(feel)}°.`);
      return { level, headline, why: reasons.join(" "), maxP, aqi, feel, wind, probs, times: wx.minutely_15?.time || [] };
    }

    function render(payload, stale) {
      const d = payload.decision;
      $("verdict").hidden = false;
      document.body.dataset.level = d.level;
      arrive();
      $("orb").setAttribute("aria-label", d.level === "go" ? "Go" : d.level === "wait" ? "Caution" : "Stay in");
      document.querySelector('meta[name="theme-color"]').content = TOP[d.level];
      put($("headline"), d.headline);
      put($("why"), d.why, 90);
      countTo($("temp"), d.feel == null ? null : Math.round(d.feel), (v) => v + "°");
      countTo($("rain"), d.maxP, (v) => v + "%");
      countTo($("air"), d.aqi == null ? null : Math.round(d.aqi), (v) => v);
      $("airl").textContent = d.aqi == null ? "Air" : "Air, " + aqiLabel(d.aqi);
      put($("place"), payload.label, 180);
      $("strip").innerHTML = d.probs.map((p, i) => {
        const t = d.times[i] ? new Date(d.times[i]).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
        return `<div class="slot${p >= 40 ? " wet" : ""}" title="${t}: ${p}%" style="--p:${Math.max(p, 4)};--i:${i}"><div class="track"><i class="bar"></i></div><div class="t">${t.replace(/\s?[AP]M/i, "")}</div></div>`;
      }).join("");
      const when = new Date(payload.savedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      $("meta").textContent = (stale ? "Offline copy from " : "Updated ") + when + " · " + (payload.sky || "");
    }

    async function load(lat, lon, label) {
      $("place").textContent = "Checking live weather…";
      document.body.classList.add("loading");
      const wxUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&minutely_15=precipitation,precipitation_probability&forecast_minutely_15=8&timezone=auto`;
      const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm2_5,pm10&timezone=auto`;
      try {
        const [wxRes, aqRes] = await Promise.all([fetch(wxUrl), fetch(aqUrl)]);
        if (!wxRes.ok) throw new Error("Weather feed unavailable (" + wxRes.status + ")");
        const wx = await wxRes.json();
        const aq = aqRes.ok ? await aqRes.json() : null;
        const payload = {
          label,
          savedAt: Date.now(),
          sky: WMO[wx.current?.weather_code] || "Conditions loaded",
          decision: decide(wx, aq)
        };
        localStorage.setItem(KEY, JSON.stringify(payload));
        render(payload, false);
      } catch (err) {
        const cached = localStorage.getItem(KEY);
        if (cached) render(JSON.parse(cached), true);
        else {
          $("place").textContent = err.message + ". Try again in a minute.";
        }
      } finally { document.body.classList.remove("loading"); }
    }

    $("locate").onclick = () => {
      if (!navigator.geolocation) { $("place").textContent = "This browser has no location."; return; }
      document.body.classList.add("loading");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        coords = { lat: pos.coords.latitude.toFixed(3), lon: pos.coords.longitude.toFixed(3) };
        let label = coords.lat + ", " + coords.lon;
        try {
          const g = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${coords.lat}&longitude=${coords.lon}&language=en`);
          if (g.ok) {
            const j = await g.json();
            const hit = j.results?.[0];
            if (hit) label = [hit.name, hit.admin1, hit.country].filter(Boolean).join(", ");
          }
        } catch (_) {}
        load(coords.lat, coords.lon, label);
      }, () => { document.body.classList.remove("loading"); $("place").textContent = "Location blocked. Allow it, or the last reading stays."; }, { timeout: 8000 });
    };

    $("refresh").onclick = () => { if (coords) load(coords.lat, coords.lon, $("place").textContent); else $("locate").click(); };

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $("install").hidden = false;
    });
    $("install").onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      $("install").hidden = true;
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    const cached = localStorage.getItem(KEY);
    if (cached) render(JSON.parse(cached), true);
    first = false;
  </script>
</body>
</html>
